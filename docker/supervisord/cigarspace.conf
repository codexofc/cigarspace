; supervisord units for the light all-in-one image:
; - nginx serves the SPA + reverse-proxies /api/* to uvicorn,
; - api (uvicorn) handles HTTP,
; - worker (arq) consumes background jobs.

[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:api]
command=/app/.venv/bin/uvicorn presentation.api.main:app --host 127.0.0.1 --port 8000 --proxy-headers --workers 1
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:worker]
command=/app/.venv/bin/arq infrastructure.workers.worker.WorkerSettings
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
