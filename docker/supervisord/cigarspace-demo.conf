; Additional units for the :demo image — embeds Postgres + Redis so a
; user can `docker run -p 80:80 cigarspace:demo` and have the whole
; stack up in one command. NEVER use this in production: data lives
; inside the container unless /var/lib/postgresql + /var/lib/redis are
; mounted as named volumes.

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode no --appendonly yes --dir /var/lib/redis
user=redis
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2
