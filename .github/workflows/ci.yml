name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cigars
          POSTGRES_PASSWORD: cigars
          POSTGRES_DB: cigars
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cigars"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: cigars
      POSTGRES_PASSWORD: cigars
      POSTGRES_DB: cigars
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_ENV: test
      LOG_LEVEL: WARNING
      API_JWT_SECRET: ci-only-secret-please-replace-in-production-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff (lint + format check)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy (best-effort, non-blocking)
        run: uv run mypy src || true
      - name: Pytest (with coverage)
        run: |
          uv run pytest -q \
            -m "not network" \
            --ignore=tests/integration \
            --maxfail=5
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - name: Build
        run: npm run build
